name: AXON scratch local chat tests
on:
  push:
    branches: [main, axon-scratch-local-only, fix-training-queue-mobile-nov13, conversational-training-streaming, installer-eta-dual-teacher-20261114, fix-ram-admission-compact-teacher, fix-teacher-loader-progress-20261114, axon-50m-research-track]
  workflow_dispatch:

concurrency:
  group: research-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: python3 -m pip install --disable-pip-version-check psutil==7.0.0
      - run: python3 -m unittest trainer.test_corpus trainer.test_teacher trainer.test_memory trainer.test_expanded_model trainer.test_chunked_corpus -v
      - run: python3 -m compileall -q trainer student.py
