name: Build and publish CPU GPU executables
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axon-exe.yml'
      - 'scripts/windows/**'
      - 'trainer/**'
      - 'student.py'
      - 'settings.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: axon-windows-exe
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Compile and verify both console executables
        run: python scripts/windows/build.py
      - name: Verify bundled bytecode entry point
        shell: pwsh
        run: |
          $payload = Get-ChildItem "$env:LOCALAPPDATA/AXONAI" -Directory -Filter 'app-*' | Select-Object -First 1
          python "$($payload.FullName)/trainer/start.pyc" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the CPU dependencies through the EXE
        shell: pwsh
        run: |
          & ./exe-build/CPU-AXON.exe --install-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $secondLaunch = & ./exe-build/CPU-AXON.exe --install-only
          $secondLaunch | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($secondLaunch -join ' ') -notmatch 'Dependencies already installed') { throw 'Dependency reuse failed' }
      - name: Verify complete CPU transformer training
        shell: pwsh
        run: |
          $payload = Get-ChildItem "$env:LOCALAPPDATA/AXONAI" -Directory -Filter 'app-*' | Select-Object -First 1
          $runtime = "$env:LOCALAPPDATA/AXONAI/environments/python312-cpu/Scripts/python.exe"
          & $runtime -B scripts/windows/smoke_train.py $payload.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified trainers as release assets (no Git push)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "trainers-$env:GITHUB_SHA"
          $files = @('CPU-AXON.exe','GPU-AXON.exe')
          $checksums = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash "exe-build/$file" -Algorithm SHA256).Hash.ToLower()
            $checksums += "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path $pwd 'exe-build/SHA256SUMS.txt'), $checksums)
          gh release create $tag exe-build/CPU-AXON.exe exe-build/GPU-AXON.exe exe-build/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "AXON AI trainers $($env:GITHUB_SHA.Substring(0,7))" --notes "Verified Windows trainers built from this source commit. No changes pushed back to main." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
