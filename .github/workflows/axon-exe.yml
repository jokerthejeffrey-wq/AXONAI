name: Build and publish CPU GPU executables
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/axon-exe.yml'
      - 'scripts/windows/**'
      - 'trainer/**'
      - 'student.py'
      - 'settings.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: axon-windows-exe
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Prepare shared verified corpus pages once
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'corpus-smoltalk-v1'
          $release = gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json isDraft 2>$null
          $existing = $LASTEXITCODE -eq 0
          if ($existing -and -not ($release | ConvertFrom-Json).isDraft) {
            gh release download $tag --repo "$env:GITHUB_REPOSITORY" --pattern corpus-manifest.json --dir trainer --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download pinned corpus manifest' }
          } else {
            python -m pip install requests==2.32.4 pyarrow==19.0.1 filelock==3.18.0
            if ($LASTEXITCODE -ne 0) { throw 'Corpus builder setup failed' }
            python scripts/windows/prepare_corpus_pages.py
            if ($LASTEXITCODE -ne 0) { throw 'Canonical corpus build failed' }
            if (-not $existing) {
              gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --draft --title 'Pinned smol-smoltalk lesson pages' --notes 'Apache-2.0 HuggingFaceTB/smol-smoltalk, revision 2ca82d2fe63c017af8d4cb30e81e95cb25516851. Canonical deduplicated ordering matches legacy trainers. Each page is SHA-256 verified against the manifest embedded in the EXE.'
              if ($LASTEXITCODE -ne 0) { throw 'Cannot create corpus release' }
            }
            $pages = Get-ChildItem .corpus-pages/*.gz
            # Batches bound Windows command-line size. Draft release stays hidden until complete.
            for ($i=0; $i -lt $pages.Count; $i+=20) {
              $end = [Math]::Min($i+19,$pages.Count-1)
              gh release upload $tag @($pages[$i..$end].FullName) --repo "$env:GITHUB_REPOSITORY" --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Corpus page upload failed' }
            }
            gh release upload $tag trainer/corpus-manifest.json --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Corpus manifest upload failed' }
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --draft=false --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Corpus publication failed' }
          }
          python -c "from trainer.chunked_corpus import load_manifest,read_assigned; m=load_manifest(); rows=read_assigned('.corpus-smoke',m,0,8); assert len(rows)==8; print('Published lesson pages verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Published corpus smoke test failed' }
      - name: Compile and verify both console executables
        run: python scripts/windows/build.py
      - name: Verify bundled bytecode entry point
        shell: pwsh
        run: |
          $payload = Get-ChildItem "$env:LOCALAPPDATA/AXONAI" -Directory -Filter 'app-*' | Select-Object -First 1
          python "$($payload.FullName)/trainer/start.pyc" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the CPU dependencies through the EXE
        shell: pwsh
        run: |
          & ./exe-build/CPU-AXON.exe --install-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $secondLaunch = & ./exe-build/CPU-AXON.exe --install-only
          $secondLaunch | Write-Host
          if ($LASTEXITCODE -ne 0 -or ($secondLaunch -join ' ') -notmatch 'Dependencies already installed') { throw 'Dependency reuse failed' }
      - name: Verify complete CPU transformer training
        shell: pwsh
        run: |
          $payload = Get-ChildItem "$env:LOCALAPPDATA/AXONAI" -Directory -Filter 'app-*' | Select-Object -First 1
          $runtime = "$env:LOCALAPPDATA/AXONAI/environments/python312-cpu/Scripts/python.exe"
          & $runtime -B scripts/windows/smoke_train.py $payload.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check cached generation and compact model training
        shell: pwsh
        run: |
          $runtime = "$env:LOCALAPPDATA/AXONAI/environments/python312-cpu/Scripts/python.exe"
          & $runtime -m unittest trainer.test_assignments trainer.test_generation trainer.test_expanded_model trainer.test_chunked_corpus -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified trainers as release assets (no Git push)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "trainers-$env:GITHUB_SHA"
          $files = @('CPU-AXON.exe','GPU-AXON.exe')
          $checksums = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash "exe-build/$file" -Algorithm SHA256).Hash.ToLower()
            $checksums += "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path $pwd 'exe-build/SHA256SUMS.txt'), $checksums)
          gh release create $tag exe-build/CPU-AXON.exe exe-build/GPU-AXON.exe exe-build/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "AXON AI trainers $($env:GITHUB_SHA.Substring(0,7))" --notes "Verified Windows trainers built from this source commit. No changes pushed back to main." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
