<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — AXONAI</title><link rel="stylesheet" href="/static/theme.css"><link rel="stylesheet" href="/static/chat.css"><script src="/config.js"></script><script src="/static/api.js"></script><script src="/static/theme.js"></script></head><body>
